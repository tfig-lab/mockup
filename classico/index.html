<title>Cockpit CAPEX · Clássico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: app shell for wide screens. Fixed brand rail (KPMG blue) + fluid 12-column workspace; drawer column opens beside the board. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#DFE4EE; --line-2:#EEF1F6;
  --fg:#16213A; --fg-2:#33415C; --muted:#5B6782;
  --brand:#00338D; --brand-2:#1E49E2; --ink:#00338D;
  --side:#00338D; --side-2:#1E49E2; --side-fg:#C7D4F0; --side-hi:#FFFFFF;
  --plan:#00338D; --real:#00A3A1; --fc:#E8962A; --ac:#C8157A; --bp:#9AA6BF; --today:#C8233F;
  --good:#0E6B45; --warn:#8A5A00; --bad:#B11D36;
  --tag-bg:#EAF0FB; --tag-fg:#00338D; --chip-on:#00338D; --chip-on-fg:#FFFFFF;
  --h0:#E8ECF4; --h1:#BFD0F5; --h2:#7FA2EE; --h3:#1E49E2; --h4:#00338D; --hfg:#0C233C; --hinh:#DDE8F7;
  --band:rgba(0,51,141,.055); --band-2:rgba(30,73,226,.025);
  --track:#E6EAF2; --hover:#F4F7FD; --sel:#EAF0FF;
  --tagmix:82%;
  --f-display:'Barlow Condensed','Arial Narrow',Arimo,sans-serif;
  --f-body:Arimo,Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1120; --surface:#111A2E; --surface-2:#16213A; --line:#26324D; --line-2:#1C2741;
  --fg:#E6ECF8; --fg-2:#C3CDE2; --muted:#93A0BC;
  --brand:#8FB0FF; --brand-2:#8FB0FF; --ink:#B4C9FF;
  --side:#071433; --side-2:#2C57E8; --side-fg:#AFC2EA; --side-hi:#FFFFFF;
  --plan:#8FB0FF; --real:#2CC7C4; --fc:#F2B860; --ac:#F06BB5; --bp:#6C7A99; --today:#FF6F86;
  --good:#5BD6A0; --warn:#F2B860; --bad:#FF8597;
  --tag-bg:#1E2B4D; --tag-fg:#B4C9FF; --chip-on:#2C57E8; --chip-on-fg:#FFFFFF;
  --h0:#1C2741; --h1:#22396E; --h2:#2F55B3; --h3:#3D6BEB; --h4:#6E95FF; --hfg:#E6ECF8; --hinh:#1E2D52;
  --band:rgba(143,176,255,.06); --band-2:rgba(143,176,255,.025);
  --track:#22304C; --hover:#17223B; --sel:#1C2A4D;
  --tagmix:38%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1120; --surface:#111A2E; --surface-2:#16213A; --line:#26324D; --line-2:#1C2741;
  --fg:#E6ECF8; --fg-2:#C3CDE2; --muted:#93A0BC;
  --brand:#8FB0FF; --brand-2:#8FB0FF; --ink:#B4C9FF;
  --side:#071433; --side-2:#2C57E8; --side-fg:#AFC2EA; --side-hi:#FFFFFF;
  --plan:#8FB0FF; --real:#2CC7C4; --fc:#F2B860; --ac:#F06BB5; --bp:#6C7A99; --today:#FF6F86;
  --good:#5BD6A0; --warn:#F2B860; --bad:#FF8597;
  --tag-bg:#1E2B4D; --tag-fg:#B4C9FF; --chip-on:#2C57E8; --chip-on-fg:#FFFFFF;
  --h0:#1C2741; --h1:#22396E; --h2:#2F55B3; --h3:#3D6BEB; --h4:#6E95FF; --hfg:#E6ECF8; --hinh:#1E2D52;
  --band:rgba(143,176,255,.06); --band-2:rgba(143,176,255,.025);
  --track:#22304C; --hover:#17223B; --sel:#1C2A4D;
  --tagmix:38%; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.4}
@media (min-width:2200px){body{font-size:15px}}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:14px;height:14px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.disp{font-family:var(--f-display)}

/* shell */
.app{display:flex;min-height:100vh;align-items:stretch}
.rail{flex:0 0 256px;background:var(--side);color:var(--side-hi);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.brand b{font-family:var(--f-display);font-size:30px;letter-spacing:.03em;line-height:1}
.brand img{display:block;height:40px;width:auto;max-width:160px;margin-bottom:6px}
.brand span{font-size:11px;color:var(--side-fg);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.prog{padding:12px;border-radius:8px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;gap:2px}
.prog .k{font-size:10.5px;color:var(--side-fg);text-transform:uppercase;letter-spacing:.14em;font-weight:700}
.prog .t{font-weight:700}
.prog .s{font-size:12px;color:var(--side-fg)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 14px;border:0;border-radius:8px;background:transparent;color:var(--side-fg);text-align:left;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.08);color:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;font-weight:700}
.railk{font-size:10.5px;color:var(--side-fg);text-transform:uppercase;letter-spacing:.14em;font-weight:700;padding:0 14px 6px}
.pkn{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:0 14px;border:0;border-radius:6px;background:transparent;color:var(--side-fg);text-align:left;cursor:pointer;font-size:13px}
.pkn:hover{background:rgba(255,255,255,.08);color:#fff}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:var(--c)}
.rail .dot{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.railnote{margin-top:auto;padding:12px;border-radius:8px;border:1px solid rgba(255,255,255,.18);font-size:12px;color:var(--side-fg);line-height:1.45}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.hdr{position:relative;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line);padding-block:18px 14px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(170px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.ribbon{position:absolute;top:24px;right:-56px;transform:rotate(35deg);background:var(--side-2);color:#fff;padding:6px 66px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.16em;pointer-events:none}
.stages{display:flex;flex-wrap:wrap;gap:4px}
.stage{display:inline-flex;align-items:center;min-height:24px;padding:0 12px;font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2)}
.stage.on{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg);font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--brand-2)}
.hrow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{margin:0;font-family:var(--f-display);font-size:42px;line-height:1;font-weight:700;color:var(--ink);text-wrap:balance}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:700;background:var(--tag-bg);color:var(--tag-fg);white-space:nowrap}
.tag.warn{background:color-mix(in srgb, #F2A93B 22%, transparent);color:var(--warn)}
.ptag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:4px;font-size:11.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb, var(--c) 15%, transparent);color:color-mix(in srgb, var(--c) var(--tagmix), var(--fg))}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;flex:none;border:2px solid var(--surface);background:var(--c)}
.avs{display:flex;align-items:center}.avs .av{margin-left:-6px}
.btn{min-height:36px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--brand-2);color:var(--brand-2)}
.btn.pri{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg)}
.btn.pri:hover{filter:brightness(1.12)}
.view{padding-block:22px 48px;padding-left:max(28px, env(safe-area-inset-left,0px));padding-right:max(28px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* controls */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{min-height:36px;padding:0 14px;border:0;border-right:1px solid var(--line);background:transparent;font-size:13px;color:var(--fg-2);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--brand-2)}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--fg-2);cursor:pointer}
.chip:hover{border-color:var(--brand-2);color:var(--brand-2)}
.chip[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lab{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px}
.qbox{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted)}
.qbox:focus-within{border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb, var(--brand-2) 18%, transparent)}
.qbox input{border:0;outline:0;font:inherit;font-size:13px;background:transparent;width:240px;color:var(--fg)}
.bar-tools{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px 14px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.pad{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.ct{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--ink);margin:0;text-wrap:balance}
.chead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.g12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}
.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}
@media (max-width:1600px){.s3,.s4{grid-column:span 6}.s5,.s7{grid-column:span 12}.s8{grid-column:span 12}}
@media (max-width:1100px){.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1400px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:36px;font-weight:700;line-height:1;color:var(--ink)}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.stripe{border-top:3px solid var(--c)}
.leg{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-2)}
.leg i{display:inline-block;width:18px;height:0;border-top:3px solid var(--c)}
.leg i.dash{border-top-style:dashed}.leg i.dot2{border-top-style:dotted}
.legs{display:flex;flex-wrap:wrap;gap:8px 16px}
.xs{overflow-x:auto}

/* plots */
.plot{position:relative;height:260px;margin:8px 0 26px 50px}
.plot.tall{height:340px}
.plot.mini{height:92px;margin:4px 0}
.plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.band{position:absolute;top:0;bottom:0}
.band span{position:absolute;top:6px;left:8px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ylab{position:absolute;left:-50px;width:42px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.xlab{position:absolute;top:100%;margin-top:6px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.today{position:absolute;top:0;bottom:0;border-left:2px dashed var(--today)}
.today span{position:absolute;bottom:4px;left:6px;font-size:10.5px;font-weight:700;color:var(--today);white-space:nowrap}
.pdot{position:absolute;width:11px;height:11px;border-radius:50%;margin:-5.5px 0 0 -5.5px;border:2px solid var(--surface);background:var(--c)}
.pval{position:absolute;transform:translate(10px,-50%);font-size:11.5px;font-weight:700;color:var(--c);white-space:nowrap;background:var(--surface);padding:0 4px;border-radius:3px}
.grid{fill:none;stroke:var(--line-2);stroke-width:1;vector-effect:non-scaling-stroke}
.l-plan{fill:none;stroke:var(--plan);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.l-real{fill:none;stroke:var(--real);stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.l-fc{fill:none;stroke:var(--fc);stroke-width:2.5;stroke-dasharray:6 5;vector-effect:non-scaling-stroke}
.l-ac{fill:none;stroke:var(--ac);stroke-width:2.5;stroke-dasharray:2 4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.l-bp{fill:none;stroke:var(--bp);stroke-width:2;vector-effect:non-scaling-stroke}
.l-br{fill:none;stroke:var(--plan);stroke-width:3;vector-effect:non-scaling-stroke}
.a-real{fill:color-mix(in srgb, var(--real) 13%, transparent);stroke:none}
.cols{display:flex;align-items:flex-end;gap:2px;height:120px;margin-left:50px;position:relative}
.cols .col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:1px;height:100%;min-width:0}
.cols .col i{flex:1;border-radius:2px 2px 0 0;min-width:2px;display:block}
.cols .col i.p{background:color-mix(in srgb, var(--plan) 28%, transparent)}
.cols .col i.r{background:var(--real)}
.cols .col i.r2{background:var(--plan)}
.cols .col.now{outline:1px dashed var(--today);outline-offset:1px}
.colx{display:flex;justify-content:space-between;margin-left:50px;font-size:11px;color:var(--muted)}

/* rows & bars */
.lrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;color:inherit}
.lrow:last-child{border-bottom:0}
button.lrow{cursor:pointer}
button.lrow:hover{background:var(--hover)}
.hbar{flex:1;position:relative;height:13px;background:var(--track);border-radius:3px;min-width:60px}
.hbar>b{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.hbar>u{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--fg);border-radius:2px}
.bar{height:8px;border-radius:4px;background:var(--track);position:relative;overflow:hidden;flex:1}
.bar>b{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:700;white-space:nowrap}

/* roadmap / gantt */
.gwrap{min-width:1100px}
.grow{display:grid;grid-template-columns:var(--lw,360px) minmax(0,1fr);border-bottom:1px solid var(--line-2);min-height:34px}
.grow.grp{background:var(--surface-2);min-height:38px}
.grow.act{min-height:28px}
.grow.del:hover,.grow.act:hover{background:var(--hover)}
.grow.selr{background:var(--sel)}
.glab{display:flex;align-items:center;gap:6px;padding:0 10px;border-right:1px solid var(--line);min-width:0;font-size:13px}
.glab .nm{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:inherit;min-width:0}
.glab .nm:hover{color:var(--brand-2);text-decoration:underline}
.gtrack{position:relative;overflow:hidden;background-image:linear-gradient(to right,var(--line-2) 1px,transparent 1px)}
.gbar{position:absolute;top:50%;height:16px;margin-top:-8px;border-radius:4px;overflow:hidden;background:color-mix(in srgb, var(--c) 26%, transparent)}
.gbar.thin{height:10px;margin-top:-5px;border-radius:3px}
.gbar.upd{background:repeating-linear-gradient(135deg, color-mix(in srgb, var(--c) 32%, transparent) 0 4px, color-mix(in srgb, var(--c) 10%, transparent) 4px 8px)}
.gbar>b{position:absolute;left:0;top:0;bottom:0;background:var(--c)}
.gbar.upd>b{background:color-mix(in srgb, var(--c) 55%, transparent)}
.gdia{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;transform:rotate(45deg);border:2px solid var(--surface);box-shadow:0 0 0 1px rgba(0,0,0,.18);background:var(--c)}
.gdia.s{position:static;margin:0 4px;display:inline-block}
.gtoday{position:absolute;top:0;bottom:0;border-left:2px dashed var(--today);pointer-events:none}
.gtxt{position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--fg-2);white-space:nowrap;padding-left:6px}
.wv{position:absolute;top:3px;bottom:3px;border-radius:4px;display:flex;align-items:center;padding:0 8px;font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;border-right:2px solid var(--surface)}
.mth{display:flex}.mth div{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--muted);padding-top:6px;border-left:1px solid var(--line-2)}
.mth div.now{color:var(--today);font-weight:700}
.eil{position:absolute;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--fg-2);white-space:nowrap}
.tog{width:28px;height:28px;border:0;background:transparent;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);padding:0;flex:none}
.tog:hover{background:var(--hover);color:var(--brand-2)}
.tog svg{transition:transform .15s}
.tog[aria-expanded="true"] svg{transform:rotate(90deg)}

/* table (monday) */
.ghead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:2px 0 10px}
.gname{font-family:var(--f-display);font-size:24px;font-weight:700;color:color-mix(in srgb, var(--c) var(--tagmix), var(--fg))}
.tbl{border-left:6px solid var(--c);border-radius:6px;overflow:hidden;border-top:1px solid var(--line-2);background:var(--surface);box-shadow:0 1px 2px rgba(12,35,60,.06)}
.tr{display:grid;grid-template-columns:36px minmax(320px,1fr) 170px 150px 86px 150px 170px 104px;align-items:stretch;border-bottom:1px solid var(--line-2);min-height:42px}
.tr:hover{background:var(--hover)}
.tr.act{background:var(--surface-2);min-height:36px}
.tr.th{min-height:34px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.tr.th:hover{background:transparent}
.tr.selr{background:var(--sel)}
.tc{display:flex;align-items:center;gap:8px;padding:0 10px;border-right:1px solid var(--line-2);min-width:0}
.tc:last-child{border-right:0}
.tc.c{justify-content:center}
.stc{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;border-right:2px solid var(--surface);text-align:center;padding:0 6px}
.nmb{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;color:inherit;min-width:0;font-size:13.5px}
.nmb:hover{color:var(--brand-2);text-decoration:underline}
.evb{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--fg-2);cursor:pointer}
.evb:hover{border-color:var(--brand-2);color:var(--brand-2)}
.batt{display:flex;height:22px;border-radius:4px;overflow:hidden;gap:2px;width:100%}

function mkSegs(d){

  if (d.ue){
    var a1 = d.me + 1, b1 = Math.min(d.ue, 20);
    if (b1 >= a1) s.push({ k:'upd', area:'O1', a:a1, b:b1, w:(b1 - a1 + 1) * 0.9, lab:'Atualização · piloto e Onda 1' });
    if (d.ue > 20) s.push({ k:'upd', area:'O2', a:21, b:d.ue, w:(d.ue - 20) * 0.9, lab:'Atualização · Onda 2' });
  }
  return s;
}
function segReal(d, s, t){
  if (s.first){ var lag = d.cap ? 1 : 0.15; return (d.cap || 1) * frac(t - lag, s.a, s.b); }

}
function segFc(d, s, t){
  var now = segReal(d, s, T);
  if (s.first && d.cap) return now + (1 - now) * lin(t, T + 1, T + 2);
  return Math.max(now, frac(t - d.ulag * 0.7, s.a, s.b));
}

function curve(fn){
  var items = [], W = 0;
  DEL.forEach(function(d){ d.segs.forEach(function(s){ if (fn(d, s)){ items.push([d, s]); W += s.w; } }); });
  if (!W) return null;
  var plan = [], real = [], fc = [];

    var p = 0, r = 0, f = 0;
    items.forEach(function(it){ var d = it[0], s = it[1]; p += s.w * frac(t, s.a, s.b); if (t <= T) r += s.w * segReal(d, s, t); if (t >= T) f += s.w * segFc(d, s, t); });
    plan.push(100 * p / W); if (t <= T) real.push(100 * r / W); if (t >= T) fc.push(100 * f / W);
  }
  var end = N; for (var k = 0; k < fc.length; k++){ if (fc[k] >= 99.5){ end = T + k; break; } }
  var pend = N; for (var j = 0; j < plan.length; j++){ if (plan[j] >= 99.5){ pend = j; break; } }
  return { plan:plan, real:real, fc:fc, W:W, end:end, pend:pend };
}

  ticks.forEach(function(v){ h += '<span class="ylab num" style="top:' + ((300 - v / ymax * 300) / 3).toFixed(2) + '%">' + (fmt ? fmt(v) : v + '%') + '</span>'; });
  [1, 6, 12, 18, 24, 30, 36].forEach(function(m){ h += '<span class="xlab" style="left:' + (X(m) / 10).toFixed(2) + '%">M' + m + '</span>'; });
  return h;
}

    var p = g.p, c = C[p.id + '|ALL'], r = c.real[T], pl = c.plan[T];
    var ms = Math.min.apply(null, g.dels.map(function(d){ return d.ms; })), me = Math.max.apply(null, g.dels.map(function(d){ return d.end; }));

function attOf(v, meta){ return Math.max(0, Math.min(100, meta ? v / meta * 100 : 100)); }
function indAtt(f){ return f.plan ? 100 : attOf(f.v, f.meta); }
function stOf(a, plan){ return a >= 100 ? [plan ? 'No plano' : 'No alvo', 'var(--good)', '#E3F6E8', '#1B7F3B'] : (a >= 92 ? ['Atenção', 'var(--warn)', '#FFF1DC', '#9A5B00'] : ['Abaixo da meta', 'var(--bad)', '#FDE7EA', '#C4213A']); }
function meioAvg(f){ var s = 0; f.meio.forEach(function(m){ s += attOf(m[3], m[4]); }); return s / f.meio.length; }
function mText(m){ return m[5] ? m[5] : m[3] + '%'; }
function mMeta(m){ return m[6] ? m[6] : 'meta ' + m[4] + '%'; }
function spark(f){
  var max = 100, n = f.hist.length;
  var X = function(i){ return (i / (n - 1) * 1000).toFixed(1); }, Y = function(v){ return (100 - v / max * 100).toFixed(1); };
  var d = f.hist.map(function(v, i){ return (i ? 'L' : 'M') + X(i) + ' ' + Y(v); }).join(' ');
  return '<svg class="spark" viewBox="0 0 1000 100" preserveAspectRatio="none" role="img" aria-label="Evolução de M' + (T - n + 1) + ' a M' + T + '"><path class="a" d="' + d + ' L1000 100 L0 100 Z"/><path class="m" d="M0 ' + Y(f.meta) + ' H1000"/><path class="s" d="' + d + '"/></svg>';
}
function mRow(f, m, j){
  var a = attOf(m[3], m[4]), st = stOf(a);
  return '<button class="mrow" data-tip="' + f.id + '-' + j + '" aria-label="' + esc(m[0]) + ': ' + esc(mText(m)) + '"><span class="trunc">' + m[0] + '</span><span class="bar"><b style="width:' + a.toFixed(0) + '%;background:' + st[1] + '"></b></span><span class="num">' + mText(m) + '</span></button>';
}
function vInd(){
  var sel = IND.filter(function(f){ return f.id === S.indSel; })[0] || IND[0];
  var h = '<div class="ind-bar"><div class="legs small"><span class="leg"><span class="dot" style="--c:var(--good)"></span>No alvo ou no plano</span><span class="leg"><span class="dot" style="--c:var(--warn)"></span>Atenção (92% a 99% da meta)</span><span class="leg"><span class="dot" style="--c:var(--bad)"></span>Abaixo da meta</span><span class="leg"><i class="dash" style="--c:var(--muted)"></i>Meta no gráfico</span></div>' +
    '<button class="infobtn" data-act="indhelp" aria-expanded="' + !!S.indHelp + '" aria-controls="ind-help">' + ic('M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 11v6M12 7.5h.01', 'sm') + 'Como ler</button></div>' +
    (S.indHelp ? '<div class="card pad ind-help" id="ind-help"><div class="ind-intro"><div class="ind-box"><span class="k" style="color:var(--brand-2)">Meio</span><b>Aquilo que eu controlo ou faço para provocar o resultado</b><span class="small muted">Mede o esforço e a execução. Reage rápido e permite corrigir o rumo antes do resultado aparecer. Ex.: 95% dos usuários capacitados.</span></div>' +
    '<div class="ind-arrow" aria-hidden="true">' + ic('M5 12h14M13 6l6 6-6 6') + '</div>' +
    '<div class="ind-box"><span class="k" style="color:var(--good)">Fim</span><b>O resultado que espero obter</b><span class="small muted">Mede o efeito na operação. Demora mais a reagir e confirma se os meios funcionaram. Ex.: 90% dos usuários executando o novo processo sem suporte da consultoria.</span></div></div>' +
    '<span class="small muted">Abra os meios de cada indicador e passe o mouse sobre cada um para ver a definição e a fórmula.</span></div>' : '');
  h += '<div class="ind-grid">' + IND.map(function(f){
    var a = indAtt(f), st = stOf(a, f.plan);
    return '<article class="card icard' + (f.id === sel.id ? ' on' : '') + '" aria-label="Indicador ' + f.id + ': ' + f.n + '">' +
      '<div class="ihead"><span class="inum">' + f.id + '</span><h3>' + f.n + '</h3>' + pill(st[0], [st[2], st[3]]) + '</div>' +
      '<div class="ival"><div style="display:flex;flex-direction:column;gap:4px"><span class="v num" style="color:' + st[1] + '">' + (f.vt || f.v + '%') + '</span><span class="small muted">' + (f.mt || 'meta ' + f.meta + '%') + '</span></div>' + spark(f) + '</div>' +
      '<p class="imede">' + f.mede + '</p>' +
      (function(){ var op = !!(S.indOpen && S.indOpen[f.id]); return '<div class="mlist"><button class="msum" data-act="indmeio" data-arg="' + f.id + '" aria-expanded="' + op + '"><span class="mdots" aria-hidden="true">' + f.meio.map(function(m){ return '<i style="background:' + stOf(attOf(m[3], m[4]))[1] + '"></i>'; }).join('') + '</span><span style="flex:1;min-width:0">' + f.meio.length + ' meios · ' + Math.round(meioAvg(f)) + '% das metas atingidas</span>' + ic('M6 9l6 6 6-6', 'sm') + '</button>' + (op ? '<div class="mbody">' + f.meio.map(function(m, j){ return mRow(f, m, j); }).join('') + '</div>' : '') + '</div>'; })() +
      '<button class="btn ilink" data-act="indsel" data-arg="' + f.id + '">Ver detalhe do indicador ' + f.id + '</button></article>';
  }).join('') + '</div>';
  // detail tree
  var a = indAtt(sel), st = stOf(a, sel.plan);
  var low = sel.meio.slice().sort(function(x, y){ return attOf(x[3], x[4]) - attOf(y[3], y[4]); }).slice(0, 2).filter(function(m){ return attOf(m[3], m[4]) < 100; });
  h += '<div class="g12"><div class="card pad s12" id="ind-detail"><div class="chead"><h2 class="ct">' + sel.id + ' · ' + sel.full + '</h2><div class="chips">' + IND.map(function(f){ return '<button class="chip" data-act="indsel" data-arg="' + f.id + '" aria-pressed="' + (f.id === sel.id) + '">' + f.id + '</button>'; }).join('') + '</div></div>' +
    '<div class="tree"><div class="tleft"><span class="small muted" style="font-weight:600">Meios (o que fazemos)</span>' + sel.meio.map(function(m, j){ var ma = attOf(m[3], m[4]), ms = stOf(ma); return '<div class="tnode" data-tip="' + sel.id + '-' + j + '" tabindex="0"><span style="display:flex;flex-direction:column;min-width:0"><b class="trunc" style="font-size:13px">' + m[0] + '</b><span class="small muted trunc">' + m[2] + '</span></span><span class="bar"><b style="width:' + ma.toFixed(0) + '%;background:' + ms[1] + '"></b></span><span class="num" style="text-align:right;font-size:12.5px;font-weight:700;color:' + ms[1] + '">' + mText(m) + '<br><span class="muted" style="font-weight:400;font-size:11px">' + mMeta(m) + '</span></span></div>'; }).join('') + '</div>' +
    '<div class="tmid" aria-hidden="true"></div>' +
    '<div class="tright"><span class="small muted" style="font-weight:600">Fim (o resultado)</span><div class="tfim" style="--c:' + st[1] + '"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">' + pill(st[0], [st[2], st[3]]) + '<span class="small muted">M' + T + '</span></div><span class="v num" style="color:' + st[1] + '">' + (sel.vt || sel.v + '%') + '</span><span class="small muted">' + (sel.mt || 'meta ' + sel.meta + '%') + '</span>' + spark(sel) +
    '<dl class="dl" style="grid-template-columns:96px minmax(0,1fr)"><dt>Fórmula</dt><dd>' + sel.f + '</dd><dt>Fonte*</dt><dd>' + sel.fonte + '</dd><dt>Frequência</dt><dd>' + sel.freq + '</dd><dt>Responsável</dt><dd style="display:flex;align-items:center;gap:6px">' + av(sel.own) + PE[sel.own].n + '</dd><dt>Gatilho*</dt><dd>' + sel.gat + '</dd></dl><span class="small muted">* Sugestão para validar. Fórmula e meios conforme a planilha de indicadores.</span></div></div></div>' + fimExtra(sel) +
    '<div class="ind-read"><b>Leitura</b><span>' + sel.nota + (low.length ? ' Os meios mais distantes da meta: ' + low.map(function(m){ return m[0] + ' (' + mText(m) + ', ' + mMeta(m) + ')'; }).join(' e ') + '.' : '') + '</span></div></div>';
  h += '</div>';
  return h;
}
var TIPEL = null;
function showTip(el){
  var k = el.getAttribute('data-tip').split('-'), f = IND.filter(function(x){ return x.id === +k[0]; })[0]; if (!f) return;
  var m = f.meio[+k[1]];
  if (!TIPEL){ TIPEL = document.createElement('div'); TIPEL.id = 'tip'; TIPEL.setAttribute('role', 'tooltip'); document.body.appendChild(TIPEL); }
  TIPEL.innerHTML = '<b>' + m[0] + '</b>' + m[1] + '<div class="tk">Fórmula</div>' + m[2] + '<div class="tk">Atual · meta</div>' + mText(m) + ' · ' + mMeta(m).replace('meta ', '') + '<div class="tk">Alimenta o fim</div>' + f.n;
  TIPEL.hidden = false;
  var r = el.getBoundingClientRect(), tw = TIPEL.offsetWidth, th = TIPEL.offsetHeight;
  var left = Math.min(window.innerWidth - tw - 12, Math.max(12, r.left + r.width / 2 - tw / 2));
  var top = r.top - th - 10; if (top < 60) top = r.bottom + 10;
  TIPEL.style.left = left + 'px'; TIPEL.style.top = top + 'px';
}
function hideTip(){ if (TIPEL) TIPEL.hidden = true; }
document.addEventListener('mouseover', function(e){ var t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); });
document.addEventListener('mouseout', function(e){ var t = e.target.closest && e.target.closest('[data-tip]'); if (t && !t.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', function(e){ var t = e.target.closest && e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); });
window.addEventListener('scroll', hideTip, { passive:true });


/* ---------- render & events ---------- */
var VIEWFN = { overview:vOverview, board:vBoard, scurve:vScurve, fin:vFin, evid:vEvid, people:vPeople, risks:vRisks, ind:vInd };
function render(){
  var keep = {}; document.querySelectorAll('.xs').forEach(function(el, i){ keep[i] = el.scrollLeft; });
  renderShell();
  document.getElementById('view').innerHTML = VIEWFN[S.view]();
  if (S.view === 'board') renderBoard(true);
  document.querySelectorAll('.xs').forEach(function(el, i){ if (keep[i]) el.scrollLeft = keep[i]; });
  bindDrop();
}
function renderBoard(){ var b = document.getElementById('bbody'); if (b) b.innerHTML = boardBody(); }
function set(o, keepToast){ if (!keepToast) o.toast = o.toast || ''; Object.assign(S, o); render(); }

var ACT = {
  view:function(a){ set({ view:a, sel:null }); try { history.replaceState(null, '', '#' + a); } catch (e) {} window.scrollTo(0, 0); },
  gopk:function(a){ set({ view:'board', fPk:a }); },
  mode:function(a){ set({ mode:a }); },
  lvl:function(a){ var lv = +a, og = {}, od = {}; PK.forEach(function(p){ og[p.id] = lv > 1; }); if (lv > 2) DEL.forEach(function(d){ od[d.code] = true; }); set({ openG:og, openD:od, lvl:lv }); },
  zoom:function(a){ set({ zoom:a }); },
  fpk:function(a){ set({ fPk:a }); },
  tg:function(a){ var o = Object.assign({}, S.openG); o[a] = !o[a]; set({ openG:o, lvl:null }); },
  td:function(a){ var o = Object.assign({}, S.openD); o[a] = !o[a]; set({ openD:o, lvl:null }); },
  sel:function(a){ set({ sel:S.sel === a ? null : a, toast:'' }); },
  opensel:function(a){ var d = DELM[a]; var og = Object.assign({}, S.openG); og[d.pk] = true; set({ view:'board', sel:a, openG:og, fPk:'ALL', q:'', toast:'' }); window.scrollTo(0, 0); },
  closesel:function(){ set({ sel:null }); },
  scF:function(a){ set({ view:'scurve', scF:a }); },
  scA:function(a){ set({ view:'scurve', scA:a }); },
  goev:function(a){ var d = DELM[a]; set({ view:'evid', evCode:a, evSt:'Todos', evPk:'ALL', upPk:d.pk, upCode:a, toast:'' }); window.scrollTo(0, 0); },
  evSt:function(a){ set({ evSt:a }); }, evPk:function(a){ set({ evPk:a, evCode:null }); },
  clearcode:function(){ set({ evCode:null }); }, evall:function(){ set({ evAll:!S.evAll }); },
  upPk:function(a){ set({ upPk:a, upCode:DEL.filter(function(d){ return d.pk === a; })[0].code }); },
  upCode:function(a){ set({ upCode:a }); },
  addact:function(a){ var d = DELM[a]; var od = Object.assign({}, S.openD); od[a] = true; var og = Object.assign({}, S.openG); og[d.pk] = true; set({ addFor:{ code:a, parent:null, a:null }, openD:od, openG:og }); focusForm(); },
  addsub:function(a){ var c = S.custom.filter(function(x){ return x.id === a; })[0]; if (c){ set({ addFor:{ code:c.code, parent:a, a:null } }); focusForm(); } },
  delact:function(a){ S.custom = S.custom.filter(function(x){ return x.id !== a && x.parent !== a; }); saveActs(); set({}); },
  cancelAdd:function(){ set({ addFor:null }); },
  trackadd:function(a, t, e){ var r = t.getBoundingClientRect(), ws = +t.getAttribute('data-ws'), nw = +t.getAttribute('data-nw'); var m = Math.max(1, Math.min(N, ws + Math.floor((e.clientX - r.left) / r.width * nw))); var od = Object.assign({}, S.openD); od[a] = true; set({ addFor:{ code:a, parent:null, a:m }, openD:od }); focusForm(); },
  indhelp:function(){ set({ indHelp:!S.indHelp }); },
  indmeio:function(a){ var o = Object.assign({}, S.indOpen); o[a] = !o[a]; set({ indOpen:o }); },
  indsel:function(a){ set({ indSel:+a }); var el = document.getElementById('ind-detail'); if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); },
  fs:function(){ try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); } catch (e) {} }
};
document.addEventListener('click', function(e){ var t = e.target.closest('[data-act]'); if (!t) return; var f = ACT[t.getAttribute('data-act')]; if (f) f(t.getAttribute('data-arg'), t, e); });
document.addEventListener('input', function(e){ if (e.target.id === 'q'){ S.q = e.target.value; renderBoard(); } });
document.addEventListener('change', function(e){ var code = e.target.getAttribute && e.target.getAttribute('data-up'); if (code && e.target.files) addFiles(e.target.files, code); });
document.addEventListener('keydown', function(e){ if (e.key !== 'Escape') return; if (S.addFor) set({ addFor:null }); else if (S.sel) set({ sel:null }); });
document.addEventListener('submit', function(e){
  var f = e.target; if (!f.getAttribute || f.getAttribute('data-form') !== 'addact') return;
  e.preventDefault();
  var fd = new FormData(f), nm = String(fd.get('name') || '').trim(); if (!nm) return;
  var a = +fd.get('a'), b = Math.max(a, +fd.get('b'));
  S.custom.push({ id:'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), code:f.getAttribute('data-code'), parent:f.getAttribute('data-parent') || null, name:nm, a:a, b:b, own:String(fd.get('own')), pct:Math.max(0, Math.min(100, +fd.get('pct') || 0)) });
  saveActs(); set({ addFor:null });
});
(function(){
  var brand = document.getElementById('brand');
  ['../assets/kpmg-logo.svg', '../assets/kpmg-logo.png'].reduceRight(function(next, src){
    return function(){ var img = new Image(); img.alt = 'KPMG'; img.onload = function(){ brand.insertBefore(img, brand.firstChild); brand.classList.add('has-logo'); }; img.onerror = next; img.src = src; };
  }, function(){})();
})();
document.addEventListener('fullscreenchange', function(){ var b = document.getElementById('fsbtn'); if (b) b.lastChild.textContent = document.fullscreenElement ? 'Sair da apresentação' : 'Modo apresentação'; });
function bindDrop(){
  var d = document.getElementById('drop'); if (!d) return;
  d.addEventListener('dragover', function(e){ e.preventDefault(); d.classList.add('on'); });
  d.addEventListener('dragleave', function(){ d.classList.remove('on'); });
  d.addEventListener('drop', function(e){ e.preventDefault(); d.classList.remove('on'); addFiles(e.dataTransfer && e.dataTransfer.files, S.upCode); });
}
function addFiles(list, code){
  var files = Array.prototype.slice.call(list || []); if (!files.length) return;
  var d = DELM[code];
  var add = files.map(function(f){ return { code:code, pk:d.pk, file:f.name || 'arquivo', own:'VC', m:'M' + T, mo:T + 1, st:'Enviado', size:f1((f.size || 0) / 1048576, 1) + ' MB', isNew:true }; });
  S.uploads = add.concat(S.uploads);
  S.toast = files.length + (files.length > 1 ? ' arquivos enviados' : ' arquivo enviado') + ' para ' + code + ' · aguardando verificação KPMG';
  if (S.view === 'evid'){ S.evSt = 'Todos'; S.evCode = null; S.evPk = 'ALL'; }
  render();
}
render();
})();
</script>
